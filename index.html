<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dot Escape</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="instructions">

    <div class="instruction-box">
        <h2>How To Play</h2>

        <p>Use the Arrow Keys to move the green player.</p>

        <p>Collect yellow dots to increase your score.</p>

        <p>Avoid the red enemy and avoid touching walls.</p>
    </div>

    <div class="instruction-box">
        <h2>Game Controls</h2>

        <p>Press spacebar to Pause the game.</p>

        <p>Press r to Resume the game.</p>

        <p>Press q to Quit the game.</p>
    </div>

</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
